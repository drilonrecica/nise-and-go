name: CI

# Runs on every push and every pull request, per docs/checks.md. This
# workflow does not build or publish release binaries (M10) and does not run
# a vulnerability scan (M9-002) — both are later-milestone scope; see
# docs/checks.md for why they are deliberately absent here.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Keep in sync with docs/toolchain.md and .tool-versions by hand; nothing
  # in this repository enforces that the three agree (see ADR 0008).
  GO_VERSION: "1.26.5"
  GOLANGCI_LINT_VERSION: "2.11.3"

jobs:
  lint:
    name: Format, vet, and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      # golangci-lint is pinned by documented version, not a go.mod `tool`
      # directive — see docs/adr/0008-toolchain-and-dependencies.md for the
      # measured go.sum growth that pinning rejected. `go install` resolves
      # and checksum-verifies the exact pinned release through the Go module
      # proxy without touching this repository's own go.mod or go.sum.
      - name: Install golangci-lint ${{ env.GOLANGCI_LINT_VERSION }}
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${{ env.GOLANGCI_LINT_VERSION }}

      - name: gofmt -s (fmt-check)
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: golangci-lint (lint)
        run: make lint

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        # See docs/supported-platforms.md for exactly which OS/architecture
        # combination each of these three runner labels exercises, and which
        # release-target combinations they do NOT exercise.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      # Ubuntu 23.10 and later restrict unprivileged user namespaces through
      # AppArmor, and GitHub's hosted ubuntu-24.04 image ships that
      # restriction on. Under it `unshare --user --net` still creates the
      # namespace and then fails the uid_map write that makes it usable:
      #
      #   unshare: write failed /proc/self/uid_map: Operation not permitted
      #
      # That is exactly the silent loss of coverage NISE_REQUIRE_NETNS (see
      # the next step) exists to turn into a failure, and restoring the
      # capability is the first of that comment's two sanctioned responses.
      # It is the better one: the netns proof is the only one of
      # test/nonetwork's three that catches a raw net.Dial ignoring
      # HTTP_PROXY, so recording its loss would mean giving that up.
      #
      # The sysctl is guarded, because the knob is Ubuntu-specific and a
      # future image may not carry it. The `unshare` that follows is not,
      # and is the actual gate: it fails here, under this step's name,
      # rather than leaving the Go suite to discover the same thing further
      # down a much longer log.
      - name: Restore unprivileged user namespaces
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --net --map-root-user -- true

      # NISE_REQUIRE_NETNS turns test/nonetwork's network-namespace proof from
      # a graceful skip into a hard failure. That proof is the only one of the
      # three that catches a raw net.Dial ignoring HTTP_PROXY, and it skips
      # when unprivileged user namespaces are unavailable. Because `make test`
      # runs `go test` without -v, such a skip is invisible in this log and
      # exit-code-identical to a pass, so the strongest proof could silently
      # stop running and nobody would learn. Setting this makes its absence
      # loud.
      #
      # Linux only: netns is unavailable on macOS and Windows by design, so
      # those legs must keep skipping gracefully.
      #
      # If this job fails on the netns test, the fix is NOT to delete this
      # variable. It means the runner blocks unprivileged user namespace
      # creation (Ubuntu 23.10+ can restrict this via AppArmor), and the
      # proof genuinely is not running — which is exactly what this variable
      # exists to reveal. Either restore the capability on the runner or
      # record the loss of coverage in docs/no-telemetry.md.
      - name: go test
        run: make test
        env:
          NISE_REQUIRE_NETNS: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}

      - name: go test -race
        run: make test-race
        env:
          NISE_REQUIRE_NETNS: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}

  migration-test:
    name: PostgreSQL migration matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          # Deliberately public throwaway credential for this job-scoped
          # disposable service, not an application or repository secret.
          POSTGRES_PASSWORD: nise-ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: Clean-install and supported-upgrade migration matrix
        run: make migration-test
        env:
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
          TEST_DATABASE_PASSWORD: nise-ci-postgres

  generation-diff:
    name: Generation diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: make generate-diff
        run: make generate-diff

  docs-check:
    name: Docs check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # No Go toolchain step: docs-check is git + grep + sed, deliberately
      # dependency-free (see docs/checks.md).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: make docs-check
        run: make docs-check
