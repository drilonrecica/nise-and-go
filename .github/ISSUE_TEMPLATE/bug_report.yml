name: Bug report
description: Report a reproducible defect in Nise & Go.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        This project has no support SLA. Remove secrets and private data before submitting.
  - type: input
    id: version
    attributes:
      label: Nise version
      description: Use an exact tag, commit, or `nise version` output.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the smallest commands or repository that reproduce the defect.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, credentials, personal data, and connection strings.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for the same defect.
          required: true
        - label: This report does not contain a vulnerability or sensitive data.
          required: true

